<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <meta name="description" content="Personal money manager: bank, Paytm and CIBIL statements read on your own device.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; connect-src 'self' https://gmail.googleapis.com https://accounts.google.com/gsi/; worker-src 'self' blob:; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Paisa Desk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="lock" class="lock" hidden></div>
  <div id="app" hidden>
    <header class="top">
      <div class="brand"><span class="logo">₹</span> Paisa Desk</div>
      <div class="top-r">
        <span id="saved" class="saved" aria-live="polite"></span>
        <button class="icon-btn" data-act="lock" aria-label="Lock">🔒</button>
        <button class="icon-btn" data-act="settings" aria-label="Settings">⚙️</button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs">
      <button data-tab="home"><span>🏠</span>Home</button>
      <button data-tab="spends"><span>📋</span>Spends</button>
      <button data-tab="import" class="tab-add"><span>⬆️</span>Import</button>
      <button data-tab="loans"><span>🏦</span>Loans</button>
      <button data-tab="plan"><span>🎯</span>Plan</button>
    </nav>
  </div>
  <div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-body" id="sheetBody"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/cibil.js"></script>
  <script src="js/cat.js"></script>
  <script src="js/store.js"></script>
  <script src="js/gmail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
